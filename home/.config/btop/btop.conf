#? btop · coolnight (run `btop`). Only the settings that differ from btop's
#? defaults are here; btop fills in the rest and never writes this file back.
color_theme = "coolnight"
theme_background = false
truecolor = true
rounded_corners = true
vim_keys = true
graph_symbol = "braille"
update_ms = 1500
proc_sorting = "cpu lazy"
proc_gradient = true
show_battery = true
save_config_on_exit = false
